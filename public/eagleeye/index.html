<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1b2129">
<title>EagleEye Commander</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/app.css?v=250">
</head>
<body>

<section id="menu" class="screen">
  <div class="menu-sky"></div>
  <div class="menu-wrap">
    <h1 class="logo"><span>EAGLE<b>EYE</b></span><span>COMMANDER</span></h1>
    <p class="tag">Byg basen. Høst malmen. Send hæren af sted, og se slaget, når alle er klar.</p>
    <div id="hub" hidden></div>
    <div class="cards">
      <form class="card" id="quickForm">
        <h2>Træfning mod AI</h2>
        <p class="sub">Spil med det samme i browseren. Ingen ventetid.</p>
        <label>Dit navn<input name="name" maxlength="20" value="General" autocomplete="off"></label>
        <div class="fpick" data-for="quick"></div>
        <div class="row3"><label>Modstandere<select name="bots"><option>1</option><option selected>2</option><option>3</option><option>4</option><option>5</option></select></label>
          <label>Kort<select name="map"></select></label><label>Størrelse<select name="size"></select></label></div>
        <div class="row3"><label>Landskab<select name="theme"></select></label><label>Startkapital<select name="money"></select></label></div>
        <button class="btn go" type="submit">Start kamp</button>
        <button class="btn" type="button" id="btnContinue" hidden>Fortsæt gemt træfning</button>
      </form>
      <form class="card" id="onlineForm" hidden>
        <h2>Kamp med venner</h2>
        <div class="seg" id="onlineSeg"><button type="button" data-m="create" class="on">Opret</button><button type="button" data-m="join">Deltag</button><button type="button" data-m="login">Log ind</button></div>
        <label data-for="create">Kampens navn<input name="game" maxlength="24" value="Operation Ørneøje"></label>
        <label data-for="join login">Invitationskode<input name="code" maxlength="6" autocapitalize="characters" spellcheck="false"></label>
        <label>Dit navn<input name="name" maxlength="20" autocomplete="username"></label>
        <label>PIN (mindst 4 tegn)<input name="pin" type="password" maxlength="40" autocomplete="current-password"></label>
        <div class="fpick" data-for="create join"></div>
        <button class="btn go" type="submit" id="onlineBtn">Opret kamp</button>
        <p class="err" id="onlineErr"></p>
      </form>
    </div>
    <button class="btn" type="button" id="btnSet0"><svg viewBox="0 0 24 24" class="cog" aria-hidden="true"><circle cx="12" cy="12" r="2.8"/><path d="M21.5 10.5L21.5 13.5L18.8 13.8L18.1 15.5L19.8 17.6L17.6 19.8L15.5 18.1L13.8 18.8L13.5 21.5L10.5 21.5L10.2 18.8L8.5 18.1L6.4 19.8L4.2 17.6L5.9 15.5L5.2 13.8L2.5 13.5L2.5 10.5L5.2 10.2L5.9 8.5L4.2 6.4L6.4 4.2L8.5 5.9L10.2 5.2L10.5 2.5L13.5 2.5L13.8 5.2L15.5 5.9L17.6 4.2L19.8 6.4L18.1 8.5L18.8 10.2Z"/></svg> Indstillinger</button>
    <p class="foot">EagleEye Commander 2.5 · en hyldest til 90'ernes strategispil</p>
  </div>
</section>

<section id="lobby" class="screen" hidden>
  <div class="menu-sky"></div>
  <div class="menu-wrap">
    <h1 class="logo small"><span>EAGLE<b>EYE</b></span><span>COMMANDER</span></h1>
    <div class="card wide" id="lobbyCard"></div>
  </div>
</section>

<section id="game" class="screen" hidden>
  <header id="top">
    <button id="btnMenu" class="ibtn" aria-label="Menu"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
    <button id="btnSet" class="ibtn" aria-label="Indstillinger" title="Indstillinger"><svg viewBox="0 0 24 24" class="cog"><circle cx="12" cy="12" r="2.8"/><path d="M21.5 10.5L21.5 13.5L18.8 13.8L18.1 15.5L19.8 17.6L17.6 19.8L15.5 18.1L13.8 18.8L13.5 21.5L10.5 21.5L10.2 18.8L8.5 18.1L6.4 19.8L4.2 17.6L5.9 15.5L5.2 13.8L2.5 13.5L2.5 10.5L5.2 10.2L5.9 8.5L4.2 6.4L6.4 4.2L8.5 5.9L10.2 5.2L10.5 2.5L13.5 2.5L13.8 5.2L15.5 5.9L17.6 4.2L19.8 6.4L18.1 8.5L18.8 10.2Z"/></svg></button>
    <button id="btnChat" class="ibtn" aria-label="Beskeder og alliancer" title="Beskeder og alliancer" hidden><svg viewBox="0 0 24 24"><path d="M4 5h16v11H10l-5 4v-4H4z"/></svg><i id="chatN" hidden></i></button>
    <div class="brand">EAGLE<b>EYE</b></div>
    <div id="roundInfo"></div>
    <div id="pips"></div>
    <div id="deadline"></div>
    <button id="btnReady" class="btn go">KLAR TIL KAMP</button>
  </header>
  <div id="stage">
    <canvas id="map"></canvas>
    <div id="banner" hidden></div>
    <div id="alerts"></div>
    <div id="info" class="panel" hidden></div>
    <div id="orders" class="panel" hidden></div>
    <div id="placebar" class="panel" hidden></div>
    <div id="replaybar" class="panel" hidden></div>
  </div>
  <aside id="side">
    <div id="money"><span class="lbl">MIDLER</span><b id="moneyN">0</b></div>
    <div id="radarBox"><canvas id="radar" width="208" height="208"></canvas></div>
    <div id="modes">
      <button id="mRepair" title="Reparér bygninger"><svg viewBox="0 0 24 24"><path d="M14.5 5.5a4.5 4.5 0 0 0-6 5.6L3.4 16.2a2 2 0 0 0 0 2.8l1.6 1.6a2 2 0 0 0 2.8 0l5.1-5.1a4.5 4.5 0 0 0 5.6-6l-2.9 2.9-2.5-.6-.6-2.5z"/></svg><span>Reparér</span></button>
      <button id="mSell" title="Sælg bygninger"><svg viewBox="0 0 24 24"><path d="M12 3v18M16.5 7.5c-.8-1.3-2.4-2-4.5-2-2.6 0-4.3 1.2-4.3 3.1 0 4.4 9.1 2 9.1 6.6 0 2-1.9 3.3-4.8 3.3-2.300 0-4.100-.9-5-2.400"/></svg><span>Sælg</span></button>
      <button id="mOrders" title="Planlæg angreb"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><path d="M12 2v6M12 16v6M2 12h6M16 12h6"/></svg><span>Angreb</span></button>
    </div>
    <div id="tabs"><button data-tab="B" class="on">Bygninger</button><button data-tab="U">Enheder</button></div>
    <div id="build">
      <div id="power" title="Strøm"><i id="powFill"></i><b id="powMark"></b></div>
      <div class="col" id="colB"></div>
      <div class="col" id="colU"></div>
    </div>
  </aside>
  <div id="tip" hidden></div>
</section>

<div id="modal" hidden><div class="box" id="modalBox"></div></div>
<div id="splash" hidden></div>
<div id="toast" hidden></div>
<script type="module" src="js/main.js?v=250"></script>
</body>
</html>
