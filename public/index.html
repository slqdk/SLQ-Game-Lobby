<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c1728">
<meta name="referrer" content="no-referrer">
<title>SLQ Game Lobby</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preload" href="fonts/fredoka.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app" data-view="boot">

  <!-- the clubhouse: also the backdrop behind the welcome and group screens -->
  <header id="top">
    <button id="btnMenu" class="ghost" title="Gruppe og konto" aria-label="Menu">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" fill="none"/></svg>
      <span id="groupName">Klubhus</span>
    </button>
    <div class="grow"></div>
    <button id="btnFriends" class="ghost" title="Hvem er her?"><span class="dot on"></span><span id="onlineCount">0</span></button>
    <button id="btnTables" class="ghost" title="Spil i gang">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="4" fill="none" stroke="currentColor" stroke-width="2.2"/><circle cx="8.5" cy="8.5" r="1.6" fill="currentColor"/><circle cx="15.5" cy="15.5" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/></svg>
      <span class="lbl">Spil</span><b id="turnBadge" class="badge" hidden>1</b>
    </button>
    <button id="btnChips" class="chips" title="Dine jetoner">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="12" cy="12" r="9.5" fill="#ffb347" stroke="#2b2233" stroke-width="2"/><circle cx="12" cy="12" r="5.6" fill="none" stroke="#2b2233" stroke-width="1.6" stroke-dasharray="3 2.2"/></svg>
      <span id="chipCount">0</span>
    </button>
    <button id="btnMe" class="ghost me" title="Dig"><canvas id="meBust" width="36" height="36"></canvas></button>
  </header>

  <main id="stage">
    <canvas id="room"></canvas>
    <aside id="friends" hidden>
      <div class="phead"><b>Klubben</b><button class="x" data-close="friends" aria-label="Luk">✕</button></div>
      <div id="friendList"></div>
    </aside>
    <div id="lost" hidden><span class="spin"></span><span id="lostText">Forbinder igen …</span></div>
  </main>
  <div id="chatlog" aria-live="polite"></div>

  <footer id="bar">
    <button id="btnChat" class="round" title="Hele samtalen" aria-label="Vis hele samtalen">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 5.5h16v10.5H10l-4.5 3.5V16H4z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/></svg>
    </button>
    <button id="btnEmote" class="round" title="Fagter" aria-label="Fagter">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2.2"/><circle cx="8.6" cy="10" r="1.3" fill="currentColor"/><circle cx="15.4" cy="10" r="1.3" fill="currentColor"/><path d="M8 14.2c1.2 1.8 6.8 1.8 8 0" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
    </button>
    <form id="chatForm" autocomplete="off">
      <input id="chatInput" maxlength="240" placeholder="Skriv til klubhuset …" enterkeyhint="send" aria-label="Skriv en besked">
      <button class="btn" aria-label="Send">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 12 20 4.5 16 20l-4-6z" fill="currentColor"/></svg>
      </button>
    </form>
  </footer>

  <!-- welcome: log in or make an account -->
  <section id="welcome" class="cover">
    <div class="card hero">
      <h1><span class="logo-chip"></span>SLQ Game Lobby</h1>
      <p class="tag">Klubhuset for dig og vennerne</p>
      <p id="inviteNote" class="note" hidden></p>
      <div class="tabs" role="tablist">
        <button data-tab="login" class="on" role="tab">Log ind</button>
        <button data-tab="register" role="tab">Opret konto</button>
      </div>
      <form id="authForm">
        <label>Navn<input name="name" maxlength="20" autocomplete="username" required></label>
        <label>Kodeord<input name="pass" type="password" maxlength="100" autocomplete="current-password" required></label>
        <label id="codeRow" hidden>Kode<input name="code" maxlength="20" autocomplete="off" placeholder="Fra din invitation"><small>Koden står i linket, du har fået. Laver du selv en gruppe, bruger du installationskoden.</small></label>
        <p id="authError" class="error" hidden></p>
        <button class="btn big" id="authGo">Log ind</button>
      </form>
    </div>
  </section>

  <!-- groups: pick one, make one, join one -->
  <section id="groups" class="cover">
    <div class="card hero">
      <h1><span class="logo-chip"></span>Dine grupper</h1>
      <div id="groupList" class="list"></div>
      <div class="row">
        <button class="btn" id="btnNewGroup">Opret en gruppe</button>
        <button class="btn alt" id="btnJoinGroup">Jeg har en kode</button>
      </div>
      <form id="groupForm" hidden>
        <label id="gfNameRow">Gruppens navn<input name="name" maxlength="30"></label>
        <label id="gfCodeRow"><span id="gfCodeLabel">Kode</span><input name="code" maxlength="20" autocomplete="off"></label>
        <p id="groupError" class="error" hidden></p>
        <div class="row"><button class="btn" id="groupGo">Opret</button><button type="button" class="btn alt" id="groupCancel">Fortryd</button></div>
      </form>
      <button class="link" id="btnLogout">Log ud</button>
    </div>
  </section>

  <!-- sheets: every menu and game opens here -->
  <div id="sheetWrap" hidden>
    <div id="sheet" role="dialog" aria-modal="true">
      <div class="phead"><b id="sheetTitle"></b><button class="x" id="sheetX" aria-label="Luk">✕</button></div>
      <div id="sheetBody"></div>
    </div>
  </div>
  <!-- a game that has a page of its own (EagleEye Commander) is shown here, on top of the clubhouse -->
  <div id="embed" hidden>
    <div id="embedBar"><b id="embedTitle"></b><button id="embedX" class="btn small alt">Tilbage til klubhuset</button></div>
    <div id="embedBox"></div>
  </div>
  <div id="toasts" aria-live="polite"></div>
</div>
<noscript><p style="padding:2rem;font-family:sans-serif">SLQ Game Lobby bruger JavaScript.</p></noscript>
<script type="module" src="js/main.js"></script>
</body>
</html>
